<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Portal de Indicações — Envios Extra</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyADPBoiQUzVf-rWGQo2rtbYMJRsEGK0fKI",
    authDomain: "portal-envios-extra.firebaseapp.com",
    projectId: "portal-envios-extra",
    storageBucket: "portal-envios-extra.firebasestorage.app",
    messagingSenderId: "400010191067",
    appId: "1:400010191067:web:d907063fdf53648f56acfe"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.__fb = {
    db,
    collection: (name) => collection(db, name),
    onSnapshot, addDoc, updateDoc, deleteDoc, doc, query, orderBy
  };
  window.dispatchEvent(new Event("firebase-ready"));
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f5f5f5;min-height:100vh}
  input,select,textarea,button{font-family:inherit}
  ::-webkit-scrollbar{width:6px}
  ::-webkit-scrollbar-thumb{background:#ddd;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const STATUS = [
  { v:"em_validacao",      l:"Em Validação",      c:"#3483FA", bg:"#EBF3FF" },
  { v:"contato_realizado", l:"Contato Realizado",  c:"#FF7733", bg:"#FFF3EB" },
  { v:"em_treinamento",    l:"Em Treinamento",     c:"#8E44AD", bg:"#F5EEF8" },
  { v:"liberado",          l:"Liberado ✅",         c:"#00A650", bg:"#E6F7EF" },
  { v:"pendencia",         l:"Pendência ⚠️",        c:"#F39C12", bg:"#FFFBE6" },
  { v:"reprovado",         l:"Reprovado ❌",         c:"#F23D4F", bg:"#FEE8EA" },
];

const PERFIS = ["TAC CPF","ETC (CNPJ)"];
const SVC = ["SSP30 - Guarulhos","SSP34 - Cotia","SSP37 - Campinas 2","SSP38 - Itupeva",
  "SSP40 - Zona Norte","SSP44 - Vila Leopoldina","SSP45 - Itaquera","SSP48 - Jaguare",
  "SSP49 - Zona Norte II","SSP3 - Campinas","SSP5 - Arena","SSP6 - Maua","SSP7 - Zona Oeste",
  "SSP01 - Zona Sul","SSP18 - Jundiai","SSP20 - Sorocaba","SSP23 - Suzano",
  "SRJ1 - Rio de Janeiro","SRJ13 - São João de Meriti","SMG1 - Contagem","SMG2 - Juiz de Fora",
  "SMG6 - Uberlândia","SPR1 - Curitiba","SPR2 - Londrina","SPR6 - Maringá",
  "SRS1 - Porto Alegre","SRS4 - Caxias do Sul","SSC1 - Joinville","SSC2 - Biguaçu",
  "SCE1 - Fortaleza","SPE1 - Recife","SBA1 - Salvador","SGO1 - Goiânia","SDF1 - Brasília","Outro"];

const getS = v => STATUS.find(s=>s.v===v)||STATUS[0];

const ST = {
  btn:    { background:"#FFE600", color:"#222", border:"none", padding:"11px 22px", borderRadius:9, cursor:"pointer", fontWeight:700, fontSize:15 },
  btnSec: { background:"#fff", color:"#444", border:"1px solid #ddd", padding:"11px 18px", borderRadius:9, cursor:"pointer", fontWeight:600, fontSize:14 },
  inp:    { width:"100%", padding:"12px 15px", border:"1.5px solid #ddd", borderRadius:9, fontSize:15, color:"#222", background:"#fff", outline:"none" },
  lbl:    { display:"block", fontSize:12, fontWeight:700, color:"#555", marginBottom:7, textTransform:"uppercase", letterSpacing:.6 },
  tag:    { background:"#f0f0f0", color:"#555", fontSize:12, padding:"4px 10px", borderRadius:12, border:"1px solid #e8e8e8" },
};

function Avatar({ name }) {
  const i = (name||"?").split(" ").slice(0,2).map(w=>w[0]).join("").toUpperCase();
  return <div style={{width:44,height:44,borderRadius:"50%",background:"#FFE600",color:"#222",fontWeight:800,fontSize:16,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,boxShadow:"0 2px 6px rgba(0,0,0,.1)"}}>{i}</div>;
}

function Badge({ status }) {
  const s = getS(status);
  return <span style={{background:s.bg,color:s.c,border:`1.5px solid ${s.c}44`,borderRadius:20,padding:"4px 12px",fontSize:13,fontWeight:700,whiteSpace:"nowrap"}}>{s.l}</span>;
}

function Modal({ onClose, children }) {
  return (
    <div onClick={e=>e.target===e.currentTarget&&onClose()}
      style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:1000,padding:16,overflowY:"auto"}}>
      <div style={{background:"#fff",borderRadius:18,width:"100%",maxWidth:540,maxHeight:"92vh",overflowY:"auto",boxShadow:"0 24px 70px rgba(0,0,0,.22)"}}>
        {children}
      </div>
    </div>
  );
}

function UploadBox({ label, emoji, preview, onFile, color }) {
  const ref = useRef();
  return (
    <div>
      <label style={ST.lbl}>{emoji} {label} *</label>
      <div onClick={()=>ref.current.click()}
        style={{border:`2.5px dashed ${preview?color:"#ddd"}`,borderRadius:14,padding:preview?10:28,textAlign:"center",cursor:"pointer",background:preview?`${color}0f`:"#fafafa",transition:"all .2s"}}>
        {preview
          ? <img src={preview} alt="" style={{maxHeight:180,maxWidth:"100%",borderRadius:10,boxShadow:"0 4px 12px rgba(0,0,0,.1)"}}/>
          : <><div style={{fontSize:36,marginBottom:8}}>{emoji}</div><p style={{color:"#aaa",fontSize:14,lineHeight:1.5}}>Clique para enviar o print<br/><span style={{fontSize:12}}>JPG ou PNG</span></p></>
        }
      </div>
      {preview && <p style={{color,fontSize:13,margin:"6px 0 0",fontWeight:600}}>✅ Imagem carregada</p>}
      <input ref={ref} type="file" accept="image/*" style={{display:"none"}}
        onChange={e=>{
          const f=e.target.files[0];if(!f)return;
          const canvas=document.createElement("canvas");
          const img=new Image();
          const reader=new FileReader();
          reader.onload=ev=>{
            img.onload=()=>{
              const MAX=800;
              let w=img.width,h=img.height;
              if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
              if(h>MAX){w=Math.round(w*MAX/h);h=MAX;}
              canvas.width=w;canvas.height=h;
              canvas.getContext("2d").drawImage(img,0,0,w,h);
              onFile(canvas.toDataURL("image/jpeg",0.6));
            };
            img.src=ev.target.result;
          };
          reader.readAsDataURL(f);
        }}/>
    </div>
  );
}

function FormIndicar({ onSubmit, onClose }) {
  const [step, setStep] = useState(1);
  const [f, setF] = useState({nome:"",tel:"",svc:"",perfil:"",obs:""});
  const [ee, setEe] = useState(null);
  const [log, setLog] = useState(null);
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);
  const set = (k,v) => setF(x=>({...x,[k]:v}));
  const ok1=f.nome.trim()&&f.tel.trim(), ok2=f.svc&&f.perfil, ok3=ee&&log;

  const submit = async () => {
    setLoading(true);
    try {
      await onSubmit({
        nome:f.nome, telefone:f.tel, svc:f.svc, perfil:f.perfil, obs:f.obs, ee, log,
        status:"em_validacao", criadoEm:new Date().toISOString(), atualizadoEm:new Date().toISOString(),
        historico:[{status:"em_validacao",data:new Date().toISOString(),obs:"Indicação recebida"}],
      });
      setDone(true);
    } catch(e) {
      console.error(e);
      if(e.code==="permission-denied"||String(e).includes("permission")) {
        alert("Sem permissao no banco de dados. Contate o admin.");
      } else {
        alert("Erro ao salvar. Tente novamente.");
      }
    }
    setLoading(false);
  };

  if (done) return (
    <div style={{padding:48,textAlign:"center"}}>
      <div style={{fontSize:64,marginBottom:12}}>✅</div>
      <h3 style={{fontSize:22,marginBottom:8}}>Indicação enviada!</h3>
      <p style={{color:"#666",fontSize:15,marginBottom:28}}>O time de aquisição irá analisar e acionar.</p>
      <button onClick={onClose} style={ST.btn}>Fechar</button>
    </div>
  );

  return (
    <div>
      <div style={{padding:"24px 24px 0",borderBottom:"1.5px solid #eee"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <h3 style={{fontSize:20,fontWeight:800}}>Indicar Motorista</h3>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:"#bbb"}}>✕</button>
        </div>
        <div style={{display:"flex",gap:5,marginBottom:10}}>
          {[1,2,3].map(n=><div key={n} style={{flex:1,height:5,borderRadius:3,background:step>=n?"#FFE600":"#eee",transition:"background .3s"}}/>)}
        </div>
        <p style={{fontSize:13,color:"#aaa",margin:"0 0 18px"}}>
          {step===1?"Passo 1 — Dados do motorista":step===2?"Passo 2 — Perfil e Base":"Passo 3 — Comprovantes"}
        </p>
      </div>
      <div style={{padding:24}}>
        {step===1 && <div style={{display:"flex",flexDirection:"column",gap:18}}>
          <div><label style={ST.lbl}>Nome completo *</label><input style={ST.inp} value={f.nome} onChange={e=>set("nome",e.target.value)} placeholder="Nome completo do motorista"/></div>
          <div><label style={ST.lbl}>Telefone *</label><input style={ST.inp} value={f.tel} onChange={e=>set("tel",e.target.value)} placeholder="(11) 99999-9999"/></div>
          <div><label style={ST.lbl}>Observações (opcional)</label><textarea style={{...ST.inp,height:80,resize:"vertical"}} value={f.obs} onChange={e=>set("obs",e.target.value)} placeholder="Informações adicionais..."/></div>
        </div>}
        {step===2 && <div style={{display:"flex",flexDirection:"column",gap:18}}>
          <div><label style={ST.lbl}>SVC / Base *</label>
            <select style={ST.inp} value={f.svc} onChange={e=>set("svc",e.target.value)}>
              <option value="">Selecione o SVC...</option>
              {SVC.map(s=><option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div><label style={ST.lbl}>Perfil RNTRC *</label>
            <div style={{display:"flex",gap:12}}>
              {PERFIS.map(p=>(
                <button key={p} onClick={()=>set("perfil",p)} style={{flex:1,padding:"16px 10px",borderRadius:12,cursor:"pointer",border:`2.5px solid ${f.perfil===p?"#FFE600":"#ddd"}`,background:f.perfil===p?"#FFFBE6":"#fff",fontWeight:f.perfil===p?800:400,fontSize:15,color:"#222",transition:"all .15s"}}>{p}</button>
              ))}
            </div>
          </div>
        </div>}
        {step===3 && <div style={{display:"flex",flexDirection:"column",gap:22}}>
          <UploadBox label="Print do Envios Extra (tela de Ganhos)" emoji="📱" preview={ee} onFile={setEe} color="#00A650"/>
          <UploadBox label="Print do App Logistics (Cadastro Concluído)" emoji="📦" preview={log} onFile={setLog} color="#3483FA"/>
        </div>}
        <div style={{display:"flex",gap:12,marginTop:24}}>
          {step>1 && <button onClick={()=>setStep(s=>s-1)} style={ST.btnSec}>← Voltar</button>}
          {step<3 && <button onClick={()=>setStep(s=>s+1)} disabled={step===1?!ok1:!ok2} style={{...ST.btn,flex:1,opacity:(step===1?!ok1:!ok2)?.4:1}}>Próximo →</button>}
          {step===3 && <button onClick={submit} disabled={!ok3||loading} style={{...ST.btn,flex:1,opacity:!ok3?.4:1}}>{loading?"Enviando...":"Enviar Indicação ✓"}</button>}
        </div>
      </div>
    </div>
  );
}

function Detalhe({ item, onClose, onUpdate, onDelete }) {
  const [status, setStatus] = useState(item.status);
  const [obs, setObs] = useState("");
  const [sav, setSav] = useState(false);
  const [confirmDel, setConfirmDel] = useState(false);

  const salvar = async () => {
    setSav(true);
    const updated = {...item, status, atualizadoEm:new Date().toISOString(),
      historico:[...(item.historico||[]),{status,data:new Date().toISOString(),obs:obs||getS(status).l}]};
    await onUpdate(updated);
    setSav(false); setObs("");
  };

  return (
    <Modal onClose={onClose}>
      <div style={{padding:24}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:20}}>
          <div style={{display:"flex",gap:14,alignItems:"center"}}>
            <Avatar name={item.nome}/>
            <div><h3 style={{fontSize:18,fontWeight:800,marginBottom:2}}>{item.nome}</h3><p style={{color:"#666",fontSize:14}}>{item.telefone}</p></div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",cursor:"pointer",fontSize:22,color:"#bbb"}}>✕</button>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:18}}>
          {[["SVC / Base",item.svc],["Perfil RNTRC",item.perfil],
            ["Indicado em",new Date(item.criadoEm).toLocaleDateString("pt-BR")],
            ["Status",<Badge status={item.status}/>]
          ].map(([k,v])=>(
            <div key={k} style={{background:"#f8f8f8",borderRadius:10,padding:"10px 14px"}}>
              <p style={{fontSize:11,color:"#aaa",textTransform:"uppercase",letterSpacing:.5,marginBottom:4}}>{k}</p>
              <div style={{fontSize:14,fontWeight:700,color:"#222"}}>{v}</div>
            </div>
          ))}
        </div>

        {item.obs && <div style={{background:"#FFFBE6",border:"1.5px solid #FFE600",borderRadius:10,padding:"10px 14px",marginBottom:18}}>
          <p style={{fontSize:12,color:"#999",marginBottom:3}}>Observações</p>
          <p style={{fontSize:14,color:"#333"}}>{item.obs}</p>
        </div>}

        {(item.ee||item.log) && <div style={{marginBottom:18}}>
          <p style={{fontSize:12,color:"#aaa",textTransform:"uppercase",letterSpacing:.5,marginBottom:10}}>Comprovantes</p>
          <div style={{display:"grid",gridTemplateColumns:(item.ee&&item.log)?"1fr 1fr":"1fr",gap:12}}>
            {item.ee && <div>
              <p style={{fontSize:12,color:"#00A650",fontWeight:700,marginBottom:5}}>📱 Envios Extra</p>
              <img src={item.ee} alt="" style={{width:"100%",borderRadius:10,border:"2px solid #00A65033",cursor:"pointer"}} onClick={()=>window.open(item.ee)}/>
            </div>}
            {item.log && <div>
              <p style={{fontSize:12,color:"#3483FA",fontWeight:700,marginBottom:5}}>📦 Logistics</p>
              <img src={item.log} alt="" style={{width:"100%",borderRadius:10,border:"2px solid #3483FA33",cursor:"pointer"}} onClick={()=>window.open(item.log)}/>
            </div>}
          </div>
        </div>}

        <div style={{borderTop:"1.5px solid #eee",paddingTop:18,marginBottom:18}}>
          <p style={{fontWeight:800,fontSize:15,marginBottom:12}}>Atualizar Status</p>
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12}}>
            {STATUS.map(st=><button key={st.v} onClick={()=>setStatus(st.v)} style={{padding:"6px 14px",borderRadius:20,cursor:"pointer",fontSize:13,fontWeight:700,border:`2px solid ${status===st.v?st.c:"#ddd"}`,background:status===st.v?st.bg:"#fff",color:status===st.v?st.c:"#888",transition:"all .15s"}}>{st.l}</button>)}
          </div>
          <textarea style={{...ST.inp,height:60,resize:"none",marginBottom:12}} placeholder="Observação (opcional)..." value={obs} onChange={e=>setObs(e.target.value)}/>
          <button onClick={salvar} disabled={sav} style={{...ST.btn,width:"100%",fontSize:15}}>{sav?"Salvando...":"Salvar Status"}</button>
        </div>

        {item.historico?.length>0 && <div style={{borderTop:"1.5px solid #eee",paddingTop:16,marginBottom:18}}>
          <p style={{fontWeight:800,fontSize:14,color:"#888",marginBottom:12}}>Histórico</p>
          {[...item.historico].reverse().map((h,i)=>{const hs=getS(h.status);return(
            <div key={i} style={{display:"flex",gap:12,alignItems:"flex-start",marginBottom:10}}>
              <div style={{width:10,height:10,borderRadius:"50%",background:hs.c,marginTop:4,flexShrink:0}}/>
              <div><span style={{fontSize:13,fontWeight:700,color:hs.c}}>{hs.l}</span><span style={{fontSize:12,color:"#bbb",marginLeft:8}}>{new Date(h.data).toLocaleString("pt-BR")}</span>{h.obs&&<p style={{margin:"3px 0 0",fontSize:12,color:"#777"}}>{h.obs}</p>}</div>
            </div>
          );})}
        </div>}

        <div style={{borderTop:"1.5px solid #eee",paddingTop:16}}>
          {!confirmDel
            ? <button onClick={()=>setConfirmDel(true)} style={{...ST.btnSec,color:"#F23D4F",borderColor:"#F23D4F44",fontSize:13,width:"100%"}}>🗑️ Excluir indicação</button>
            : <div style={{background:"#FEE8EA",borderRadius:10,padding:"14px 16px"}}>
                <p style={{fontSize:14,color:"#F23D4F",fontWeight:700,marginBottom:12}}>Confirmar exclusão?</p>
                <div style={{display:"flex",gap:10}}>
                  <button onClick={()=>setConfirmDel(false)} style={{...ST.btnSec,flex:1,fontSize:13}}>Cancelar</button>
                  <button onClick={()=>onDelete(item.id)} style={{...ST.btn,flex:1,fontSize:13,background:"#F23D4F",color:"#fff"}}>Excluir</button>
                </div>
              </div>
          }
        </div>
      </div>
    </Modal>
  );
}

function Card({ item, onOpen }) {
  const s = getS(item.status);
  return (
    <div onClick={()=>onOpen(item)}
      style={{background:"#fff",border:"1.5px solid #eee",borderRadius:14,padding:16,cursor:"pointer",borderLeft:`5px solid ${s.c}`,transition:"box-shadow .15s,transform .15s"}}
      onMouseEnter={e=>{e.currentTarget.style.boxShadow="0 6px 20px rgba(0,0,0,.09)";e.currentTarget.style.transform="translateY(-1px)";}}
      onMouseLeave={e=>{e.currentTarget.style.boxShadow="none";e.currentTarget.style.transform="none";}}>
      <div style={{display:"flex",gap:12,alignItems:"center"}}>
        <Avatar name={item.nome}/>
        <div style={{flex:1,minWidth:0}}>
          <p style={{fontWeight:800,fontSize:15,color:"#222",whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",marginBottom:2}}>{item.nome}</p>
          <p style={{fontSize:13,color:"#888"}}>{item.telefone}</p>
        </div>
        <Badge status={item.status}/>
      </div>
      {item.obs && <p style={{fontSize:12,color:"#888",marginTop:8,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>💬 {item.obs}</p>}
      <div style={{display:"flex",gap:7,marginTop:8,flexWrap:"wrap",alignItems:"center"}}>
        <span style={ST.tag}>{item.svc}</span>
        <span style={ST.tag}>{item.perfil}</span>
        {item.ee&&<span style={{...ST.tag,color:"#00A650",borderColor:"#00A65033"}}>📱 EE</span>}
        {item.log&&<span style={{...ST.tag,color:"#3483FA",borderColor:"#3483FA33"}}>📦 LOG</span>}
        <span style={{...ST.tag,marginLeft:"auto"}}>{new Date(item.criadoEm).toLocaleDateString("pt-BR")}</span>
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("ops");
  const [ind, setInd] = useState([]);
  const [showF, setShowF] = useState(false);
  const [det, setDet] = useState(null);
  const [filtro, setFiltro] = useState("todos");
  const [svcFiltro, setSvcFiltro] = useState("todos");
  const [q, setQ] = useState("");
  const [fbReady, setFbReady] = useState(!!window.__fb);
  const [loading, setLoading] = useState(true);

  useEffect(()=>{
    if (!window.__fb) {
      window.addEventListener("firebase-ready", ()=>setFbReady(true), {once:true});
      return;
    }
    const {onSnapshot, collection, query, orderBy, db} = window.__fb;
    const unsub = onSnapshot(
      query(collection("indicacoes"), orderBy("criadoEm","desc")),
      snap => { setInd(snap.docs.map(d=>({id:d.id,...d.data()}))); setLoading(false); },
      err => { console.error(err); setLoading(false); }
    );
    return unsub;
  }, [fbReady]);

  const addInd = async (data) => {
    const {addDoc, collection} = window.__fb;
    await addDoc(collection("indicacoes"), data);
  };

  const updateInd = async (item) => {
    const {updateDoc, doc, db} = window.__fb;
    const {id, ...data} = item;
    await updateDoc(doc(db, "indicacoes", id), data);
    setDet({...item});
  };

  const deleteInd = async (id) => {
    const {deleteDoc, doc, db} = window.__fb;
    await deleteDoc(doc(db, "indicacoes", id));
    setDet(null);
  };

  const counts = STATUS.reduce((a,s)=>({...a,[s.v]:ind.filter(i=>i.status===s.v).length}),{});
  const fil = ind.filter(i=>(filtro==="todos"||i.status===filtro)&&(svcFiltro==="todos"||i.svc===svcFiltro)&&(!q||i.nome?.toLowerCase().includes(q.toLowerCase())||i.telefone?.includes(q)));
  const svcsUsados = ["todos",...[...new Set(ind.map(i=>i.svc).filter(Boolean))].sort()];

  if (!fbReady || loading) return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",height:"100vh",flexDirection:"column",gap:16}}>
      <div style={{width:48,height:48,border:"5px solid #FFE600",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
      <p style={{color:"#666",fontSize:16}}>Carregando...</p>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );

  return (
    <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",background:"#f5f5f5",minHeight:"100vh"}}>
      <div style={{background:"#1a1a1a",padding:"0 20px",position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 12px rgba(0,0,0,.3)"}}>
        <div style={{maxWidth:900,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",height:58}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{background:"#FFE600",color:"#222",fontWeight:900,fontSize:13,padding:"3px 9px",borderRadius:5}}>MELI</div>
            <span style={{color:"#fff",fontSize:15,fontWeight:700}}>Envios Extra</span>
            <span style={{color:"#555",fontSize:13}}>— Portal de Indicações</span>
          </div>
          <div style={{display:"flex",gap:3}}>
            {[{k:"ops",l:"🚛 Operação"},{k:"admin",l:"⚙️ Admin"}].map(({k,l})=>(
              <button key={k} onClick={()=>setView(k)} style={{background:view===k?"#FFE600":"transparent",color:view===k?"#222":"#aaa",border:"none",padding:"6px 14px",borderRadius:7,cursor:"pointer",fontWeight:700,fontSize:13,transition:"all .15s"}}>{l}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{maxWidth:900,margin:"0 auto",padding:"28px 18px"}}>
        {view==="ops" && <>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
            <div><h2 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Minhas Indicações</h2><p style={{color:"#888",fontSize:14}}>{ind.length} motorista{ind.length!==1?"s":""} indicado{ind.length!==1?"s":""}</p></div>
            <button onClick={()=>setShowF(true)} style={{...ST.btn,fontSize:15}}>+ Indicar Motorista</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:22}}>
            {STATUS.map(s=><div key={s.v} style={{background:"#fff",borderRadius:12,padding:"14px 16px",border:`1.5px solid ${s.c}33`,boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}>
              <p style={{fontSize:26,fontWeight:900,color:s.c,marginBottom:2}}>{counts[s.v]||0}</p>
              <p style={{fontSize:12,color:"#888"}}>{s.l}</p>
            </div>)}
          </div>
          {ind.length===0
            ? <div style={{textAlign:"center",padding:"60px 20px",background:"#fff",borderRadius:16,border:"1.5px solid #eee"}}>
                <div style={{fontSize:52,marginBottom:12}}>🚛</div>
                <h3 style={{fontSize:20,marginBottom:6}}>Nenhuma indicação ainda</h3>
                <p style={{color:"#888",fontSize:15,marginBottom:22}}>Indique um motorista para começar</p>
                <button onClick={()=>setShowF(true)} style={{...ST.btn,fontSize:15}}>+ Indicar Motorista</button>
              </div>
            : <div style={{display:"flex",flexDirection:"column",gap:10}}>{ind.map(i=><Card key={i.id} item={i} onOpen={setDet}/>)}</div>
          }
        </>}

        {view==="admin" && <>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
            <div><h2 style={{fontSize:22,fontWeight:800,marginBottom:4}}>Painel Administrativo</h2><p style={{color:"#888",fontSize:14}}>{ind.length} indicações no total</p></div>
            <button onClick={()=>setShowF(true)} style={{...ST.btn,fontSize:15}}>+ Indicar</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:22}}>
            {STATUS.map(s=><div key={s.v} onClick={()=>setFiltro(filtro===s.v?"todos":s.v)}
              style={{background:filtro===s.v?s.bg:"#fff",borderRadius:12,padding:"14px 16px",border:`2px solid ${filtro===s.v?s.c:"#eee"}`,cursor:"pointer",transition:"all .15s",boxShadow:"0 2px 8px rgba(0,0,0,.04)"}}>
              <p style={{fontSize:26,fontWeight:900,color:s.c,marginBottom:2}}>{counts[s.v]||0}</p>
              <p style={{fontSize:12,color:"#888"}}>{s.l}</p>
            </div>)}
          </div>
          <div style={{display:"flex",gap:10,marginBottom:10,flexWrap:"wrap"}}>
            <input style={{...ST.inp,flex:2,minWidth:180,fontSize:15}} placeholder="🔍  Buscar por nome ou telefone..." value={q} onChange={e=>setQ(e.target.value)}/>
            <select style={{...ST.inp,flex:1,minWidth:140,fontSize:14}} value={svcFiltro} onChange={e=>setSvcFiltro(e.target.value)}>
              {svcsUsados.map(s=><option key={s} value={s}>{s==="todos"?"📍 Todos os SVCs":s}</option>)}
            </select>
            {(filtro!=="todos"||svcFiltro!=="todos")&&<button onClick={()=>{setFiltro("todos");setSvcFiltro("todos");}} style={{...ST.btnSec,whiteSpace:"nowrap",fontSize:13}}>Limpar ✕</button>}
          </div>
          {fil.length===0
            ? <div style={{textAlign:"center",padding:44,background:"#fff",borderRadius:14,color:"#aaa",fontSize:15}}>Nenhum resultado encontrado.</div>
            : <div style={{display:"flex",flexDirection:"column",gap:10}}>{fil.map(i=><Card key={i.id} item={i} onOpen={setDet}/>)}</div>
          }
        </>}
      </div>

      {showF && <Modal onClose={()=>setShowF(false)}><FormIndicar onSubmit={async r=>{await addInd(r);setShowF(false);}} onClose={()=>setShowF(false)}/></Modal>}
      {det && <Detalhe item={det} onClose={()=>setDet(null)} onUpdate={updateInd} onDelete={deleteInd}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
